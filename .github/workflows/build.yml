name: google drive

on:
  push:
    branches:
      - master
      - 'SP/**'
      - 'HF/**'
      - company_release
      - 'GOOGLEDOCS**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      commitMessage:
        description: Enter the Commit Message
        required: true

env:
  DEVELOPMENT_VERSION: "5.0.1-A.1-SNAPSHOT" # The version that will be set in pom files after the release (next dev version)
  RELEASE_VERSION: "5.0.0" # The version of the release (tag)
  MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
  MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
  QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
  QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  GITHUB_EVENT: ${{ github.event_name }}
  BRANCH_NAME: ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  Run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - stage: build
          - stage: e2e_tests
            variant: default
            acs_version: "26.3.0-A.6"
          - stage: e2e_tests
            variant: default
            acs_version: "25.5.0-A.6"
          - stage: e2e_tests
            variant: bundled
            acs_version: "23.7.1"
          - stage: e2e_tests
            variant: bundled
            acs_version: "25.4.1"
          - stage: e2e_tests
            variant: bundled
            acs_version: "26.2.1"
      fail-fast: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: adopt
          java-version: 21
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@98bcfbe06aafffdc0e9a790f352602316f82303b # v18.23.0

      - name: Setup maven
        shell: bash
        run: |
          [ -d ${HOME}/.m2/ ] || mkdir -p ${HOME}/.m2/
          cp -v _ci/settings.xml ${HOME}/.m2/

      - name: Cache the Maven packages to speed up build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: "Login to Docker Hub"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: "Login to Quay.io"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: quay.io
          username: ${{ env.QUAY_USERNAME }}
          password: ${{ env.QUAY_PASSWORD }}

      - name: Run ${{ matrix.stage }} ${{ matrix.variant }} ${{ matrix.acs_version }}
        if: ${{ github.ref_name != 'company_release' }}
        env:
          ACS_VERSION: ${{ matrix.acs_version }}
          VARIANT: ${{ matrix.variant }}
        run: |
           bash _ci/init.sh
           bash _ci/${{ matrix.stage }}.sh

      - name: "Dump all Docker containers logs"
        if: ${{ failure() && matrix.stage == 'e2e_tests' }}
        uses: Alfresco/alfresco-build-tools/.github/actions/docker-dump-containers-logs@98bcfbe06aafffdc0e9a790f352602316f82303b # v18.23.0

      - name: "Tear down the E2E stack"
        if: ${{ always() && matrix.stage == 'e2e_tests' }}
        run: docker ps -aq | xargs -r docker rm -f
  pmd_scan:
    name: "PMD Scan"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      !contains(github.event.head_commit.message, '[skip pmd]') &&
      !contains(github.event.head_commit.message, '[skip tests]') &&
      !contains(github.event.head_commit.message, '[force]')
    steps:
      - uses: Alfresco/ya-pmd-scan@1f36f8e45695ce60362010345a99a0c8f7310264 # v4.4.1
        with:
          fail-on-new-issues: "false"
          create-github-annotations: "false"
          classpath-enable: "false"

  Release:
    permissions:
      contents: write
      id-token: write
    if: ${{ ( startsWith(github.ref_name, 'HF/')  || startsWith(github.ref_name, 'SP/') || github.ref_name == 'master' )  &&
        contains(github.event.head_commit.message, '[trigger release]') || contains(inputs.commitMessage, '[trigger release]') }}
    runs-on: ubuntu-latest
    needs: Run
    steps:
      - name: "Generate GitHub App Token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}

      # Credentials are intentionally persisted here: maven-release-slim runs
      # 'git push origin <tag>', which needs them in .git/config.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@98bcfbe06aafffdc0e9a790f352602316f82303b # v18.23.0

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: adopt
          java-version: 21
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Cache the Maven packages to speed up build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: "Login to Quay.io"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_REGION }}

      - name: "Release"
        timeout-minutes: 60
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-release-slim@98bcfbe06aafffdc0e9a790f352602316f82303b # v18.23.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-version: ${{ env.RELEASE_VERSION }}
          development-version: ${{ env.DEVELOPMENT_VERSION }}
          commit-message-prefix: "[maven-release-plugin][skip ci]"
          maven-args: -DskipTests -Dadditionalparam=-Xdoclint:none

      - name: "Prepare staging deploy"
        run: |
          bash _ci/init.sh
          bash _ci/prepare_staging_deploy.sh

      - name: "Deploy Community artifacts to S3 Staging Bucket"
        uses: Alfresco/alfresco-build-tools/.github/actions/s3-upload@98bcfbe06aafffdc0e9a790f352602316f82303b # v18.23.0
        with:
          aws-region: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_REGION }}
          aws-role-arn: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_ROLE_ARN }}
          s3-bucket: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_BUCKET }}
          s3-path: alfresco-artefacts-staging/community/GoogleDocs/${{ env.RELEASE_VERSION }}
          deploy-dir: ./deploy_dir_community

      - name: "Deploy Enterprise artifacts to S3 Staging Bucket"
        uses: Alfresco/alfresco-build-tools/.github/actions/s3-upload@98bcfbe06aafffdc0e9a790f352602316f82303b # v18.23.0
        with:
          aws-region: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_REGION }}
          aws-role-arn: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_ROLE_ARN }}
          s3-bucket: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_BUCKET }}
          s3-path: alfresco-artefacts-staging/enterprise/GoogleDocs/${{ env.RELEASE_VERSION }}
          deploy-dir: ./deploy_dir_enterprise

  Company-Release:
    permissions:
      contents: write
      id-token: write
    if: github.ref_name == 'company_release'
    runs-on: ubuntu-latest
    steps:
      - name: "Generate GitHub App Token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@98bcfbe06aafffdc0e9a790f352602316f82303b # v18.23.0

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: adopt
          java-version: 21
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Cache the Maven packages to speed up build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: "Login to Quay.io"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_REGION }}

      - name: "Prepare release deploy"
        run: |
          bash _ci/init.sh
          source _ci/prepare_release_deploy.sh
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: "Deploy Community artifacts to S3 Release Bucket"
        uses: Alfresco/alfresco-build-tools/.github/actions/s3-upload@98bcfbe06aafffdc0e9a790f352602316f82303b # v18.23.0
        with:
          aws-region: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_REGION }}
          aws-role-arn: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_ROLE_ARN }}
          s3-bucket: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_BUCKET }}
          s3-path: release/community/GoogleDocs/${{ env.VERSION }}
          deploy-dir: ./deploy_dir_community

      - name: "Deploy Enterprise artifacts to S3 Release Bucket"
        uses: Alfresco/alfresco-build-tools/.github/actions/s3-upload@98bcfbe06aafffdc0e9a790f352602316f82303b # v18.23.0
        with:
          aws-region: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_REGION }}
          aws-role-arn: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_ROLE_ARN }}
          s3-bucket: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_BUCKET }}
          s3-path: release/enterprise/GoogleDocs/${{ env.VERSION }}
          deploy-dir: ./deploy_dir_enterprise
