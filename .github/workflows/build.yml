name: google drive

on:
  push:
    branches:
      - master
      - 'SP/**'
      - 'HF/**'
      - company_release
      - 'GOOGLEDOCS**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      commitMessage:
        description: Enter the Commit Message
        required: true
env:
  DEVELOPMENT_VERSION: "5.0.1-A.1-SNAPSHOT" # The version that will be set in pom files after the release (next dev version)
  RELEASE_VERSION: "5.0.0" # The version of the release (tag)
  MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
  MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
  QUAY_PASSWORD:  ${{ secrets.QUAY_PASSWORD }}
  QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  GIT_USERNAME: ${{ secrets.BOT_GITHUB_USERNAME }}
  GIT_EMAIL: ${{ secrets.BOT_GITHUB_EMAIL }}
  GIT_PASSWORD: ${{ secrets.BOT_GITHUB_TOKEN }}
  GITHUB_EVENT: ${{ github.event_name }}
  BRANCH_NAME: ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  Run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - stage: build
          - stage: e2e_tests
            variant: default
            acs_version: "26.3.0-A.6"
          - stage: e2e_tests
            variant: default
            acs_version: "25.5.0-A.6"
          - stage: e2e_tests
            variant: bundled
            acs_version: "23.7.1"
          - stage: e2e_tests
            variant: bundled
            acs_version: "25.4.1"
          - stage: e2e_tests
            variant: bundled
            acs_version: "26.2.1"
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: adopt
          java-version: 21
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@21bf54d131a99eaea590867434e6eccdd8654569 # v18.25.0

      - name: Setup maven
        shell: bash
        run: |
          [ -d ${HOME}/.m2/ ] || mkdir -p ${HOME}/.m2/
          cp -v _ci/settings.xml ${HOME}/.m2/

      - name: Cache the Maven packages to speed up build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: "Login to Docker Hub"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: "Login to Quay.io"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ env.QUAY_USERNAME }}
          password: ${{ env.QUAY_PASSWORD }}

      - name: Run ${{ matrix.stage }} ${{ matrix.variant }} ${{ matrix.acs_version }}
        if: ${{ github.ref_name != 'company_release' }}
        env:
          ACS_VERSION: ${{ matrix.acs_version }}
          VARIANT: ${{ matrix.variant }}
        run: |
           bash _ci/init.sh
           bash _ci/${{ matrix.stage }}.sh

      - name: "Dump all Docker containers logs"
        if: ${{ failure() && matrix.stage == 'e2e_tests' }}
        uses: Alfresco/alfresco-build-tools/.github/actions/docker-dump-containers-logs@21bf54d131a99eaea590867434e6eccdd8654569 # v18.25.0

      - name: "Tear down the E2E stack"
        if: ${{ always() && matrix.stage == 'e2e_tests' }}
        run: docker ps -aq | xargs -r docker rm -f
  pmd_scan:
    name: "PMD Scan"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      !contains(github.event.head_commit.message, '[skip pmd]') &&
      !contains(github.event.head_commit.message, '[skip tests]') &&
      !contains(github.event.head_commit.message, '[force]')
    steps:
      - uses: Alfresco/ya-pmd-scan@1f36f8e45695ce60362010345a99a0c8f7310264 # v4.4.1
        with:
          fail-on-new-issues: "false"
          create-github-annotations: "false"
          classpath-enable: "false"

  Release:
    permissions:
      contents: write  # needed for tag creation and commit push
    if: ${{ ( startsWith(github.ref_name, 'HF/')  || startsWith(github.ref_name, 'SP/') || github.ref_name == 'master' )  &&
        contains(github.event.head_commit.message, '[trigger release]') || contains(inputs.commitMessage, '[trigger release]') }}
    runs-on: ubuntu-latest
    needs: Run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: adopt
          java-version: 21
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Cache the Maven packages to speed up build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: "Login to Quay.io"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_STAGING_ACCESS_KEY }}
          aws-secret-access-key:  ${{ secrets.AWS_S3_STAGING_SECRET_KEY }}
          aws-region: eu-west-1

      - name: Get branch name
        uses: Alfresco/alfresco-build-tools/.github/actions/get-branch-name@21bf54d131a99eaea590867434e6eccdd8654569 # v18.25.0

      - uses: Alfresco/alfresco-build-tools/.github/actions/configure-git-author@21bf54d131a99eaea590867434e6eccdd8654569 # v18.25.0
        with:
          username: ${{ env.GIT_USERNAME }}
          email: ${{ env.GIT_EMAIL }}
          global: true
      - name: Run Script Release to nexus
        run: |
          bash _ci/init.sh
          bash _ci/release.sh
          bash _ci/prepare_staging_deploy.sh
      - name: "Release to S3 Staging Bucket"
        run: | 
           aws s3 cp --recursive ./deploy_dir_community s3://alfresco-artefacts-staging/community/GoogleDocs/${VERSION}
           aws s3 cp --recursive ./deploy_dir_enterprise s3://alfresco-artefacts-staging/enterprise/GoogleDocs/${VERSION}

  Company-Release:
    permissions:
      contents: write  # needed for tag creation and commit push
    if: github.ref_name == 'company_release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: 'false'

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: adopt
          java-version: 21
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Cache the Maven packages to speed up build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: "Login to Quay.io"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_RELEASE_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_RELEASE_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Run Script
        run: |
          bash _ci/init.sh
          source _ci/prepare_release_deploy.sh
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: "Release to Community version to S3 Staging Bucket"
        run: |
          aws s3 cp --recursive ./deploy_dir_community s3://eu.dl.alfresco.com/release/community/GoogleDocs/${VERSION}

      - name: "Release to enterprise version to S3 Bucket"
        run: |
          aws s3 cp --recursive ./deploy_dir_enterprise s3://eu.dl.alfresco.com/release/enterprise/GoogleDocs/${VERSION}
